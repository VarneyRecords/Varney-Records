<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - Varney Records</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header sticky">
        <div class="container">
            <div class="logo">
                <h1>Varney Records</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#artists">Artists</a></li>
                    <li><a href="index.html#releases">Releases</a></li>
                    <li><a href="index.html#news">News</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="application-section section-padding">
            <div class="container">
                <h1>Apply Now</h1>
                <p class="intro-text">Interested in joining Varney Records? Fill out the form below.</p>

                <!-- Embedded Tally Form -->
                <iframe data-tally-src="https://tally.so/embed/nWQL5P?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                        loading="lazy" width="100%" height="1287" frameborder="0" marginheight="0" marginwidth="0" title="Application"></iframe>
                <script>
                    var d=document,w="https://tally.so/widgets/embed.js",v=function(){
                        "undefined"!=typeof Tally?Tally.loadEmbeds():
                        d.querySelectorAll("iframe[data-tally-src]:not([src])")
                        .forEach((function(e){e.src=e.dataset.tallySrc}));
                    };
                    if("undefined"!=typeof Tally)v();
                    else if(d.querySelector('script[src="'+w+'"]')==null){
                        var s=d.createElement("script");
                        s.src=w;s.onload=v;s.onerror=v;d.body.appendChild(s);
                    }
                </script>

                <!-- Manual Redirect Button -->
                <div class="redirect-button">
                    <a href="index.html" class="btn btn-primary">Back to Home</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p class="copyright">© 2025 Varney Records. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
